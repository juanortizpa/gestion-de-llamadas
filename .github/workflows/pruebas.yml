name: Pruebas

on:
  push:
    branches: [main, harold]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # El programa debe correr igual en Windows, macOS y Linux: se prueba en los tres
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar el proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pruebas (sin modelos ni audios; solo llamadas sinteticas)
        run: pytest -q
      - name: Lanzador unico (crea el entorno e instala dependencias desde cero)
        shell: bash
        run: |
          echo "LLM_PROVIDER=local" > .env      # evita el menu interactivo
          python iniciar.py --solo-preparar
          test -d .venv

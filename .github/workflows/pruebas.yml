name: Pruebas

on:
  push:
    branches: [harold]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar el proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pruebas (sin modelos ni audios; solo llamadas sinteticas)
        run: pytest -q

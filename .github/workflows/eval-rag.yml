name: Medicion RAG

# Mide la busqueda del Asistente en modo hibrido (palabras + vectores) con los casos dorados de eval/casos.py.
# No usa ninguna IA de texto ni claves: solo llama.cpp con el modelo de embeddings (~180 MB en total).
on:
  workflow_dispatch:
  push:
    branches: [harold]
    paths: [".github/workflows/eval-rag.yml", "src/llamadas/chat/**", "eval/casos.py"]

jobs:
  rag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar el proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Medir solo por palabras (sin modelo de embeddings, modo degradado)
        run: |
          python eval/run_eval.py --suite rag --engine ninguna | tee rag_palabras.txt
          { echo "### Solo palabras"; echo '```'; cat rag_palabras.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Descargar llama.cpp y el modelo de embeddings (sin Whisper ni Qwen)
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import descargar_modelos as d; d.LLM.mkdir(parents=True, exist_ok=True); d.llama_cpp(); d.embeddings()"
      - name: Medir la busqueda
        run: |
          python eval/run_eval.py --suite rag --engine ninguna | tee rag.txt
          { echo '### Híbrido (palabras + vectores)'; echo '```'; cat rag.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-rag
          path: eval/resultados/

name: Ataque de inyeccion

# Ataca nuestra propia auditoria con una IA real (Qwen2.5-3B local, en CPU): alguien dice en la llamada lo que la IA deberia
# concluir. Despues corre los casos dorados para comprobar que el validador nuevo no descarta respuestas legitimas.
# No usa claves ni datos reales.
on:
  workflow_dispatch:
  push:
    branches: [harold]
    paths: [".github/workflows/ataque-ia.yml", "eval/ataque_inyeccion.py", "src/llamadas/auditor.py"]

# una corrida nueva reemplaza a la anterior (evita corridas viejas atascadas en cola)
concurrency:
  group: ataque-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ataque:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar el proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Descargar llama.cpp y Qwen2.5-3B (sin Whisper)
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import descargar_modelos as d; d.LLM.mkdir(parents=True, exist_ok=True); d.llama_cpp(); d.gguf('Qwen/Qwen2.5-3B-Instruct-GGUF', 'qwen2.5-3b-instruct-q4_k_m.gguf', 'IA local rapida (Qwen2.5-3B)')"
      - name: Ataque de inyeccion
        run: |
          python eval/ataque_inyeccion.py --engine local --mode rapido | tee ataque.txt
          { echo "### Ataque de inyección"; cat ataque.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Casos dorados (el validador nuevo no debe descartar respuestas legitimas)
        run: |
          python eval/run_eval.py --suite auditoria --engine local --mode rapido --reps 1 | tee dorados.txt
          f="$(ls -t eval/resultados/*_detalle.csv | head -1)"
          n=$(grep -c "cita_de_otro_rol_descartada" "$f" || true)
          { echo "### Casos dorados con Qwen2.5-3B"; echo '```'; cat dorados.txt; echo '```'; echo "Respuestas descartadas por ser del otro interlocutor: $n"; } >> "$GITHUB_STEP_SUMMARY"
          { echo "Filas descartadas (caso, sub-check, esperado):"; echo '```'; grep "cita_de_otro_rol_descartada" "$f" | cut -d, -f6,10,12,13 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ataque-inyeccion
          path: eval/resultados/
